# Write-boundary matrix for a shared run at orchestrator/runs/<client>/<run-id>/.
# Mirrors the artifact-ownership rules in the pasted refactor spec (Phase 4),
# adapted to the additive architecture recorded in
# docs/refactor/unified-agent-decisions.md (DEC-1): backend/ and frontend/
# keep their own internal runs/ trees; this matrix governs only the shared
# run this orchestrator module owns.

owners:
  orchestrator:
    writes:
      - request.yaml
      - state.json
      - core-change-set.json
      - upgrade-context.json
      - contexts/backend.json
      - contexts/frontend.json
      - client-discovery.json
      - backend-configuration-evidence.json
      - requirements/all.yaml
      - requirements/backend.yaml
      - requirements/frontend.yaml
      - requirements/shared.yaml
      - requirements/decisions.yaml
      - requirement-coverage.yaml
      - missing-steps.yaml
      - deployment-checklist.yaml
      - before-deployment.md
      - after-deployment.md
      - final-report.md

  backend-track:
    writes:
      - results/backend-result.yaml   # written by `orchestrator compose-results`, sourced
                                       # read-only from backend/runs/<client>/<run-id>/state.json
    neverWrites:
      - results/frontend-result.yaml
      - requirement-coverage.yaml
      - deployment-checklist.yaml

  frontend-track:
    writes:
      - results/frontend-result.yaml  # written by `orchestrator compose-results`, sourced
                                       # read-only from frontend/runs/<client>/<run-id>/state.json
    neverWrites:
      - results/backend-result.yaml
      - requirement-coverage.yaml
      - deployment-checklist.yaml

rules:
  - "backend/runs/ and frontend/runs/ are never written to by this module — read-only."
  - "A domain's own result file is derived from its own state.json; the orchestrator never re-derives domain results from raw source inspection."
  - "verify-coverage runs after both requested tracks report a terminal status."
  - "prepare-handover runs only after verify-coverage succeeds."
