schemaVersion: 1
lifecycleOwner: engine
runLocation: orchestrator/runs/<client>/<run-id>/

owners:
  engine:
    writes:
      - request.yaml
      - state.json
      - core-change-set.json
      - upgrade-context.json
      - contexts/backend.json
      - contexts/frontend.json
      - client-discovery.json
      - backend-configuration-evidence.json
      - requirements/all.yaml
      - requirements/backend.yaml
      - requirements/frontend.yaml
      - requirements/shared.yaml
      - requirements/decisions.yaml
      - requirement-coverage.yaml
      - missing-steps.yaml
      - deployment-checklist.yaml
      - before-deployment.md
      - after-deployment.md
      - final-report.md
      - plans/backend.json
      - plans/frontend.json
      - results/backend-validation.json
      - results/frontend-validation.json
      - results/backend/
      - results/frontend/

  backend-track:
    writes:
      - artifacts/backend/
    neverWrites:
      - results/frontend-result.yaml
      - requirement-coverage.yaml
      - deployment-checklist.yaml
      - state.json
      - core-change-set.json

  frontend-track:
    writes:
      - artifacts/frontend/
    neverWrites:
      - results/backend-result.yaml
      - requirement-coverage.yaml
      - deployment-checklist.yaml
      - state.json
      - core-change-set.json

rules:
  - "Track run files are compatibility artifact/checkpoint projections, never independent lifecycle authority."
  - "The engine registers plans, dispatches executors and publishes result envelopes only from run-bound validated evidence."
  - "New engine runs cannot substitute unrelated historical track result paths."
  - "verify-coverage runs after both requested tracks report a terminal status."
  - "prepare-handover runs only after verify-coverage succeeds."
