phases:
  - id: "01-discovery"
    state: DISCOVERY
    card: workflows/core-upgrade/phases/01-discovery.md
  - id: "01b-tool-bootstrap"
    state: TOOL_BOOTSTRAP
    card: workflows/core-upgrade/phases/01b-tool-bootstrap.md
  - id: "02-baseline"
    state: BASELINE
    card: workflows/core-upgrade/phases/02-baseline.md
  - id: "03-plan"
    state: PLAN
    card: workflows/core-upgrade/phases/03-plan.md
  - id: "04-upgrade"
    state: UPGRADE
    card: workflows/core-upgrade/phases/04-upgrade.md
  - id: "05-build-and-fix"
    state: BUILD_AND_FIX
    card: workflows/core-upgrade/phases/05-build-and-fix.md
  - id: "06-test"
    state: TEST
    card: workflows/core-upgrade/phases/06-test.md
  - id: "07-document"
    state: DOCUMENT
    card: workflows/core-upgrade/phases/07-document.md
  - id: "08-handover"
    state: HANDOVER
    card: workflows/core-upgrade/phases/08-handover.md

# Capability gates resolved via runs/<client>/<run-id>/tool-manifest.json before a
# phase may begin. A phase is BLOCKED_NEEDS_DEVELOPER if a required capability is
# unavailable after bootstrap + install + retry.
capabilityGates:
  TOOL_BOOTSTRAP:
    requiredCapabilities:
      - repository-version-control
      - search-repository
    optionalCapabilities:
      - container-isolation
  BUILD_AND_FIX:
    requiredCapabilities:
      - restore-nuget-dependency-graph
      - build-dotnet
    optionalCapabilities:
      - selectively-decompile-dotnet     # decompile-first evidence when applicable+permitted
      - compare-dotnet-public-api
  # A VERSION_RESEARCH activity (when approved knowledge is insufficient) requires:
  VERSION_RESEARCH:
    requiredCapabilities:
      - acquire-nuget-package
      - compare-dotnet-public-api
    optionalCapabilities:
      - selectively-decompile-dotnet
      - acquire-npm-package
      - typecheck-typescript
    blockedWhen:
      - anyRequiredCapabilityMissing
      - anyRequiredToolValidationFailed
      - requiredCredentialUnavailable

exceptionHandlingOwner: engine
