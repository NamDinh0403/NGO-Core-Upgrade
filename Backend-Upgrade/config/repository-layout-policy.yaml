# Repository layout policy for the NGO Core upgrade agent (backend).
# Enforced by tools/repo-layout.test.js. The FINAL_CUTOVER removed the legacy
# layer; this policy prevents it from returning.
schemaVersion: 1
id: repository-layout-policy
lastReviewedAt: 2026-08-19

allowedRootDirectories:
  - .config          # standard local .NET tool manifest metadata (narrow purpose)
  - config           # agent + tool policy
  - docs
  - evals
  - knowledge
  - memory
  - runs
  - schemas
  - skills
  - templates
  - tools
  - workflows

allowedRootFiles:
  - AGENTS.md
  - README.md

requiredDirectories:
  - config
  - knowledge/canonical
  - knowledge/index
  - memory/episodes
  - schemas
  - skills
  - templates
  - tools
  - workflows/core-upgrade/phases

forbiddenLegacyDirectories:
  - Agent
  - Case-Studies
  - Version-Changes
  - Templates          # normalized to lowercase templates/

forbiddenLegacyFiles:
  - BOOT.md
  - ARCHITECTURE.md
  - refactor.md        # relocated to docs/refactor/refactor-plan.md
  - tools.md           # relocated to docs/refactor/tool-bootstrap-plan.md

# These legacy document names must not appear in source or ACTIVE documentation.
# References are permitted only inside the historical migration records under
# docs/refactor/ (and this policy file itself).
forbiddenLegacyReferenceNames:
  - 1-operating-kernel.md
  - 2-reasoning-loop.md
  - 3-execution-guide.md
  - 4-fix-pattern-workflow.md

# Paths whose contents are historical and exempt from the legacy-reference scan.
historicalExemptPaths:
  - docs/refactor/
  - config/repository-layout-policy.yaml

namingConvention:
  directories: kebab-case
  markdownFiles: kebab-case.md
  errorRecords: exact-error-code.json      # e.g. CS0246.json
  versionRecords: full-semver.json         # e.g. 9.1.0.json
  statusValues: SCREAMING_SNAKE_CASE

canonicalLocations:
  knowledge: knowledge/canonical
  derivedKnowledge: knowledge/derived
  knowledgeIndex: knowledge/index
  workflow: workflows/core-upgrade
  skills: skills
  memoryEpisodes: memory/episodes
  memoryApproved: memory/approved
  templates: templates
  schemas: schemas
  runs: runs
