schemaVersion: 1
id: frontend-repository-layout-policy
description: Allowed on-disk layout for the frontend agent repository. Enforced by tools/repo-layout.test.js.

namingConvention: lowercase-kebab-case for ordinary repository directories

allowedRootDirectories:
  - config
  - docs
  - evals
  - knowledge
  - runs
  - schemas
  - skills
  - templates
  - tests
  - tools

allowedRootFiles:
  - README.md
  - AGENTS.md
  - .gitignore

requiredDirectories:
  - config
  - docs
  - knowledge/canonical/releases
  - knowledge/canonical/migrations
  - knowledge/canonical/appsettings
  - schemas
  - skills
  - tests
  - tools/lib

# Case-sensitive directory names that must never reappear at the repository root
# (they were normalized to lowercase).
forbiddenRootDirectories:
  - Knowledge
  - Templates

# Files that must not exist at the repository root.
forbiddenRootFiles:
  - release-notes.md
  - compiler-error-fix-loop.png
  - CHANGELOG.md
  - agent-guide.md
  - instructions.md
  - CLAUDE.md
  - client-snapshot.template.md

# Globs forbidden ANYWHERE in the tree (except runs/). Removed multi-session
# snapshot/delta workflow artifacts.
forbiddenLegacyArtifacts:
  - client-snapshot.md
  - client-snapshot.template.md
  - html-snapshot.md
  - html-delta.md
  - upgrade-delta.md
  - frontend-upgrade-plan-*.md
  - frontend-upgrade-report-*.md

canonicalKnowledge:
  releases: knowledge/canonical/releases
  migrations: knowledge/canonical/migrations
  appsettings: knowledge/canonical/appsettings
  versions: knowledge/canonical/versions/version-manifest.json
  derivedMarkdown: knowledge/derived
  rawImport: knowledge/raw/release-note-import
  index: knowledge/index

generatedRunPaths:
  - runs

testPaths:
  - tests

documentationAssetPaths:
  - docs/assets

# The runtime engine must never read raw release-note import files.
runtime:
  mustNotReadRawReleaseNotes: true
  runtimeSourceDir: tools/lib
  forbiddenRuntimeReadPatterns:
    - "release-notes.md"
    - "knowledge/raw/"

notes:
  - Run artifacts live only under runs/<client>/<run-id>/ and are git-ignored.
  - Canonical structured YAML is authoritative; Markdown under knowledge/derived is generated/validated from it.
  - The workspace-root release-notes.md has since been removed; only the sanitized import copy under knowledge/raw/release-note-import/ remains. Its exposed IATI key still requires rotation - see docs/operations/secret-redaction.md.
  - No snapshot or delta files are copied between repositories or sessions.
